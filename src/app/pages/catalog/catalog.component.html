<div class="container-page py-12">
  <h1 class="font-serif text-4xl text-bella-900 mb-2">Catálogo</h1>
  <p class="text-bella-500 mb-8">{{ filtered().length }} produtos encontrados</p>

  <div class="flex flex-col md:flex-row gap-4 md:items-center md:justify-between mb-10 pb-6 border-b border-bella-200">
    <input
      [ngModel]="search()"
      (ngModelChange)="search.set($event)"
      type="text"
      placeholder="Buscar por nome..."
      class="input-field md:w-72"
    />

    <div class="flex flex-wrap gap-4">
      <select [ngModel]="category()" (ngModelChange)="category.set($event)" class="input-field md:w-40">
        @for (cat of categories; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>

      <select [ngModel]="sort()" (ngModelChange)="sort.set($event)" class="input-field md:w-48">
        <option value="recent">Mais recentes</option>
        <option value="price-asc">Menor preço</option>
        <option value="price-desc">Maior preço</option>
        <option value="name">Nome A-Z</option>
      </select>
    </div>
  </div>

  @if (loading()) {
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      @for (i of [1,2,3,4,5,6,7,8]; track i) {
        <div class="aspect-[3/4] bg-bella-200 animate-pulse"></div>
      }
    </div>
  } @else if (filtered().length === 0) {
    <div class="text-center py-24">
      <p class="text-bella-500">Nenhum produto encontrado com esses filtros.</p>
    </div>
  } @else {
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
      @for (product of filtered(); track product.id) {
        <app-product-card [product]="product" (addToCart)="addToCart($event)" />
      }
    </div>
  }
</div>
